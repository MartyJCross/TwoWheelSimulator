name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Physics tests
        run: build\Release\sim_tests.exe -v

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\twowheel.exe dist\
          Copy-Item README.md dist\

      - uses: actions/upload-artifact@v4
        with:
          name: TwoWheelSimulator-windows-x64
          path: dist/
          if-no-files-found: error

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run physics tests (no SDL)
        run: |
          cmake -S . -B build -DTWS_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ./build/sim_tests
